name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include safe, minimal steps without secrets or real cookies.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks
      description: List the tests or IdP flow that you ran.
    validations:
      required: true
