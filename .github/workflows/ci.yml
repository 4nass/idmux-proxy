name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run vet
        run: go vet ./...

      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o /tmp/idmux-proxy ./cmd/idmux-proxy

      - name: Build container image
        run: docker build --file deploy/Dockerfile --tag idmux-proxy:ci .

      - name: Validate Compose file
        env:
          KEYCLOAK_IMAGE: example.invalid/keycloak:pinned
          IDMUX_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose --file deploy/docker-compose.example.yml config --quiet
