services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:?Set KEYCLOAK_IMAGE to a pinned Keycloak image}
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: change-me-local-only
    ports:
      - "8081:8080"

  idmux:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      IDMUX_ENV: development
      IDMUX_LISTEN_PORT: ":9000"
      IDMUX_UPSTREAM_URL: http://keycloak:8080
      IDMUX_COOKIE_NAME: KEYCLOAK_IDENTITY
      IDMUX_SESSION_COOKIE_NAME: IDMUX_SESSION
      IDMUX_ENCRYPTION_KEY: ${IDMUX_ENCRYPTION_KEY:?Set IDMUX_ENCRYPTION_KEY}
      IDMUX_COOKIE_SECURE: "false"
      IDMUX_COOKIE_SAMESITE: lax
      IDMUX_TRUSTED_ORIGINS: http://localhost:9000
    depends_on:
      - keycloak
    ports:
      - "9000:9000"
