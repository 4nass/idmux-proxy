<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} · {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f6f8fb;
        line-height: 1.6;
      }
      body { margin: 0; }
      header { background: #172033; color: #fff; }
      .bar, main, footer { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem; }
      .bar { padding-top: 1rem; padding-bottom: 1rem; }
      .brand { color: #fff; font-size: 1.25rem; font-weight: 700; text-decoration: none; }
      nav { display: flex; flex-wrap: wrap; gap: .8rem 1.1rem; margin-top: .65rem; }
      nav a { color: #dbeafe; text-decoration: none; }
      nav a:hover, nav a:focus { color: #fff; text-decoration: underline; }
      main { padding-top: 2.2rem; padding-bottom: 3rem; }
      article { background: #fff; border: 1px solid #dce3ee; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 10px #1720330d; }
      h1, h2, h3 { line-height: 1.25; color: #172033; }
      h1 { margin-top: 0; }
      a { color: #075985; }
      code, pre { background: #eef2f7; border-radius: 4px; }
      code { padding: .1rem .3rem; }
      pre { overflow-x: auto; padding: 1rem; }
      pre code { padding: 0; }
      table { border-collapse: collapse; display: block; overflow-x: auto; width: 100%; }
      th, td { border: 1px solid #dce3ee; padding: .55rem .7rem; text-align: left; vertical-align: top; }
      th { background: #eef2f7; }
      footer { color: #526070; font-size: .9rem; padding-bottom: 2rem; }
      @media (min-width: 760px) { .bar { display: flex; align-items: center; justify-content: space-between; gap: 2rem; } nav { margin-top: 0; } article { padding: 2.2rem; } }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/getting-started.html' | relative_url }}">Start</a>
          <a href="{{ '/configuration.html' | relative_url }}">Config</a>
          <a href="{{ '/architecture.html' | relative_url }}">Architecture</a>
          <a href="{{ '/operations.html' | relative_url }}">Operations</a>
          <a href="{{ '/security-invariants.html' | relative_url }}">Security</a>
          <a href="{{ '/contributing.html' | relative_url }}">Contribute</a>
          <a href="https://github.com/4nass/idmux-proxy">Code</a>
        </nav>
      </div>
    </header>
    <main>
      <article>
        {{ content }}
      </article>
    </main>
    <footer>
      <p>IdMux Proxy is maintained in public by 4nass and its contributors.</p>
    </footer>
  </body>
</html>
